<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="서울 동부 실거주 매수 임장 체크리스트">
  <title>임장 체크리스트 · 서울 동부 실거주</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <a class="skip-link" href="#checklist">체크리스트로 바로가기</a>

  <header class="top">
    <div class="wrap">
      <p class="eyebrow">서울 동부 · 실거주 매수</p>
      <h1 class="title">임장 체크리스트</h1>
      <p class="lede">현장에서 하나씩 눌러 확인하세요. 서두르지 않고, 빠짐없이.</p>
    </div>
  </header>

  <div class="progress-bar-sticky" role="region" aria-label="전체 진행률">
    <div class="wrap progress">
      <div class="progress-meta">
        <span class="progress-label">진행률</span>
        <span id="progressText" class="progress-text" aria-live="polite">0 / 44</span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="완료한 항목" aria-valuemin="0" aria-valuenow="0" aria-valuemax="44">
        <div id="progressBar" class="progress-fill" style="width:0%"></div>
      </div>
    </div>
    <nav class="jump" aria-label="섹션 바로가기">
      <ol class="jump-list wrap">
        <li><a href="#section-1">가기 전</a></li>
        <li><a href="#section-2">동네</a></li>
        <li><a href="#section-3">건물·주차</a></li>
        <li><a href="#section-4">실내 공간</a></li>
        <li><a href="#section-5">하자·수리</a></li>
        <li><a href="#section-6">관리·계약</a></li>
        <li><a href="#section-7">다시 확인</a></li>
      </ol>
    </nav>
  </div>

  <main class="wrap">
    <div id="checklist" class="checklist" aria-label="임장 체크리스트"></div>
  </main>

  <footer class="foot">
    <div class="wrap">
      <div class="save-note">
        <span class="save-dot" aria-hidden="true"></span>
        <p>체크 상태는 <strong>이 기기의 브라우저에만</strong> 저장됩니다. 서버로 전송되지 않으며, 다른 기기나 다른 브라우저와는 공유되지 않아요. 브라우저 데이터를 지우면 함께 사라집니다.</p>
      </div>
      <button id="resetButton" class="reset-button" type="button">체크 모두 초기화</button>
      <p class="foot-meta">서울 동부 실거주 매수 임장용</p>
    </div>
  </footer>

  <script src="app.js?v=2" defer></script>
</body>
</html>
